[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "xian-abci"
dynamic = ["version"]
description = "Python-based ABCI server for CometBFT"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Xian Core Team" }]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0,<0.31",
    "loguru>=0.7.3,<0.8",
    "protobuf==3.20.3",
    "pynacl>=1.6.2,<2",
    "xian-contracting",
    "xian-py",
]
keywords = ["blockchain", "cometbft", "abci", "xian", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/xian-technology/xian-abci"

[dependency-groups]
dev = [
    "parameterized>=0.9.0,<0.10",
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.15.6,<0.16",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "abci.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xian = [
    "services/bds/config.json",
    "tools/state_patches/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py311"
exclude = [
    "build_proto.py",
    "src/cometbft",
    "src/gogoproto",
    "src/tendermint",
    "src/xian/tools",
    "tests",
    "tests/tools/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.uv.sources]
xian-contracting = { path = "../xian-contracting", editable = true }
xian-py = { path = "../xian-py", editable = true }
