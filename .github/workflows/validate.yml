name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: xian
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out xian-abci
        uses: actions/checkout@v7
        with:
          path: xian-abci

      - name: Resolve matching branch ref
        id: branch-ref
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "ref=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Check out xian-contracting
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracting
          ref: main
          path: xian-contracting

      - name: Check out xian-configs
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-configs
          ref: main
          path: xian-configs

      - name: Check out xian-contracts
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracts
          ref: main
          path: xian-contracts

      - name: Check out xian-stack
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-stack
          ref: main
          path: xian-stack

      - name: Check out xian-py
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-py
          ref: main
          path: xian-py

      - name: Check out xian-js
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-js
          ref: main
          path: xian-js

      - name: Use matching dependency branches when available
        shell: bash
        env:
          REF_NAME: ${{ steps.branch-ref.outputs.ref }}
        run: |
          set -euo pipefail
          for repo in xian-contracting xian-configs xian-contracts xian-stack xian-py xian-js; do
            REMOTE="https://github.com/xian-technology/${repo}"
            if git ls-remote --exit-code --heads "$REMOTE" "$REF_NAME" >/dev/null 2>&1; then
              git -C "$repo" fetch --depth=1 origin "$REF_NAME"
              git -C "$repo" checkout -B "$REF_NAME" FETCH_HEAD
            fi
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: xian-js/package-lock.json

      - name: Install uv
        run: python -m pip install uv

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libhdf5-dev build-essential

      - name: Validate repository
        working-directory: xian-abci
        env:
          XIAN_ABCI_COVERAGE: "1"
        run: |
          ./scripts/validate-repo.sh

      - name: Validate native fastpath parity
        working-directory: xian-abci
        run: ./scripts/validate-native-fastpath.sh

      - name: Validate SDK transaction parity
        working-directory: xian-abci
        env:
          XIAN_PY_DIR: ${{ github.workspace }}/xian-py
          XIAN_JS_DIR: ${{ github.workspace }}/xian-js
        run: ./scripts/validate-sdk-transaction-parity.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: xian-abci-coverage
          path: xian-abci/coverage.xml
          if-no-files-found: error
