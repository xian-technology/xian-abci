name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: xian
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out xian-abci
        uses: actions/checkout@v7
        with:
          path: xian-abci

      - name: Resolve matching branch ref
        id: branch-ref
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "ref=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Check out xian-contracting
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracting
          ref: 15dc52f1ce07fb223e23cc89dbb6da61fd3bb07f
          path: xian-contracting

      - name: Check out xian-configs
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-configs
          ref: 12b364d36c7a200e37a4ab5e07b67b9c75bb5349
          path: xian-configs

      - name: Check out xian-contracts
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracts
          ref: eaecfa359fccd24a6f76d9949ac17d10233cdb57
          path: xian-contracts

      - name: Check out xian-stack
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-stack
          ref: 44e329927fb8f96d85b225f99d349cc76e82aba2
          path: xian-stack

      - name: Check out xian-py
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-py
          ref: 2d47ceee4f4542bc6b44a97ef56c6943aa10581a
          path: xian-py

      - name: Check out xian-js
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-js
          ref: 9d0db1102f46020b9987dc92322a304ef7bf2a94
          path: xian-js

      - name: Use matching dependency branches when available
        shell: bash
        env:
          REF_NAME: ${{ steps.branch-ref.outputs.ref }}
        run: |
          set -euo pipefail
          for repo in xian-contracting xian-configs xian-contracts xian-stack xian-py xian-js; do
            REMOTE="https://github.com/xian-technology/${repo}"
            if git ls-remote --exit-code --heads "$REMOTE" "$REF_NAME" >/dev/null 2>&1; then
              git -C "$repo" fetch --depth=1 origin "$REF_NAME"
              git -C "$repo" checkout -B "$REF_NAME" FETCH_HEAD
            fi
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: xian-js/package-lock.json

      - name: Install uv
        run: python -m pip install uv

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential

      - name: Check the locked install without editable packages
        working-directory: xian-abci
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/xian-abci-locked
          XIAN_CONFIGS_DIR: ${{ github.workspace }}/xian-configs
        run: |
          uv sync --locked --no-editable --group dev
          uv run --no-sync python - <<'PYTHON'
          from importlib.metadata import entry_points

          entry_points(group="console_scripts")["xian-abci"].load()
          PYTHON
          uv run --no-sync pytest tests/unit/test_admission_parity.py tests/integration/test_crash_replay.py

      - name: Validate repository
        working-directory: xian-abci
        env:
          XIAN_ABCI_COVERAGE: "1"
          XIAN_TEST_BDS_DSN: postgresql://postgres:1234@localhost:5432/xian
        run: |
          ./scripts/validate-repo.sh

      - name: Validate SDK transaction parity
        working-directory: xian-abci
        env:
          XIAN_PY_DIR: ${{ github.workspace }}/xian-py
          XIAN_JS_DIR: ${{ github.workspace }}/xian-js
        run: ./scripts/validate-sdk-transaction-parity.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: xian-abci-coverage
          path: xian-abci/coverage.xml
          if-no-files-found: error
