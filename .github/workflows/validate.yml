name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: xian
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out xian-abci
        uses: actions/checkout@v4
        with:
          path: xian-abci

      - name: Check out xian-contracting
        uses: actions/checkout@v4
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v4
        with:
          repository: xian-technology/xian-py
          path: xian-py

      - name: Check out xian-configs
        uses: actions/checkout@v4
        with:
          repository: xian-technology/xian-configs
          path: xian-configs

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libhdf5-dev build-essential

      - name: Validate repository
        working-directory: xian-abci
        env:
          XIAN_ABCI_COVERAGE: "1"
        run: |
          ./scripts/validate-repo.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: xian-abci-coverage
          path: xian-abci/coverage.xml
          if-no-files-found: error
