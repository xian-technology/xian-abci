name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: xian
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out xian-abci
        uses: actions/checkout@v6
        with:
          path: xian-abci

      - name: Check out xian-contracting
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-contracting
          ref: main
          path: xian-contracting

      - name: Check out xian-configs
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-configs
          ref: main
          path: xian-configs

      - name: Check out xian-contracts
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-contracts
          ref: main
          path: xian-contracts

      - name: Check out xian-stack
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-stack
          ref: main
          path: xian-stack

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libhdf5-dev build-essential

      - name: Run release validation
        working-directory: xian-abci
        run: ./scripts/validate-release.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Verify built version matches tag
        run: |
          python - <<'PY'
          import pathlib
          import sys

          expected = "${{ github.ref_name }}".removeprefix("v")
          files = [path.name for path in pathlib.Path("dist").iterdir() if path.is_file()]
          if not files:
              raise SystemExit("No distribution artifacts were built")
          if not all(expected in name for name in files):
              raise SystemExit(
                  f"Built artifacts do not match tag version {expected}: {files}"
              )
          PY

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/xian-tech-abci
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          name: release-dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "xian-tech-abci ${GITHUB_REF_NAME#v}" \
            --generate-notes
