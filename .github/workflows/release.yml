name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable ABCI tag to publish or backfill"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: release-refs/tags/${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: xian
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out xian-abci
        uses: actions/checkout@v7
        with:
          path: xian-abci
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Check out xian-contracting
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracting
          ref: f75be56cca443b31d3f13f50ec4f1dbeebaa6f3a
          path: xian-contracting

      - name: Check out xian-configs
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-configs
          ref: 9989997558826d14bf2aac12bfd38ef91eae3768
          path: xian-configs

      - name: Check out xian-contracts
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracts
          ref: 1b16f1d98674f6db22d5ee7dd9266ba90f8b0ca8
          path: xian-contracts

      - name: Check out xian-stack
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-stack
          ref: 29c8bac92d4aa96f2b1bd7bfaf116f35f86cb873
          path: xian-stack

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential

      - name: Run release validation
        working-directory: xian-abci
        env:
          XIAN_TEST_BDS_DSN: postgresql://postgres:1234@localhost:5432/xian
        run: ./scripts/validate-release.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Verify built version matches tag
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          def python_dist_version(version):
              match = re.fullmatch(r"(\d+\.\d+\.\d+)-(alpha|beta|rc)\.(\d+)", version)
              if not match:
                  return version
              marker = {"alpha": "a", "beta": "b", "rc": "rc"}[match.group(2)]
              return f"{match.group(1)}{marker}{match.group(3)}"

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          accepted = {expected, python_dist_version(expected)}
          files = [path.name for path in pathlib.Path("dist").iterdir() if path.is_file()]
          if not files:
              raise SystemExit("No distribution artifacts were built")
          if not all(any(version in name for version in accepted) for name in files):
              raise SystemExit(
                  f"Built artifacts do not match tag version {expected}: {files}"
              )
          PY

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/xian-tech-abci
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${RELEASE_TAG}" == *"-"* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "xian-tech-abci ${RELEASE_TAG#v}" \
            --generate-notes \
            "${release_flags[@]}"
